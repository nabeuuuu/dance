<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dance - Creative Coding</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.gif@0.0.2/p5.gif.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Franklin Gothic Medium', sans-serif;
    }

    #startMessage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 40px;
      border-radius: 8px;
      font-size: 24px;
      z-index: 50;
      text-align: center;
    }

    #controls {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(236, 236, 236, 0.95);
      padding: 20px;
      border-radius: 8px;
      z-index: 100;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 280px;
      max-height: 90vh;
      overflow-y: auto;
    }

    h3 {
      margin-top: 0;
      margin-bottom: 15px;
    }

    .control-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 13px;
    }

    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }

    input[type="checkbox"] {
      margin-right: 8px;
      cursor: pointer;
    }

    button {
      padding: 8px 12px;
      margin-right: 5px;
      margin-bottom: 5px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #333;
      color: white;
      font-weight: bold;
      transition: background 0.3s;
      font-size: 12px;
    }

    button:hover {
      background: #555;
    }

    .button-group {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    #image {
      position: fixed;
      bottom: 20px;
      left: 20px;
      max-width: 200px;
      max-height: 300px;
      border: 2px solid #f1f1f1;
      object-fit: contain;
      display: none;
    }

    .value-display {
      font-size: 12px;
      color: #666;
      margin-left: 10px;
    }

    .color-btn {
      width: 35px;
      height: 35px;
      border-radius: 4px;
      cursor: pointer;
      flex: 1;
      min-width: 25px;
      transition: transform 0.2s;
    }

    .color-btn:hover {
      transform: scale(1.1);
      border: 2px solid #333;
    }
  </style>
</head>

<body>
  <div id="startMessage">
    <p>🎬 Appuyez sur START pour commencer</p>
  </div>

  <div id="controls">
    <h3>🎨 Creative Tools</h3>

    <!-- VITESSE D'AFFICHAGE -->
    <div class="control-group">
      <label>⏱ Vitesse (FPS)</label>
      <input type="range" id="delayRange" min="15" max="50" value="30" step="1">
      <span class="value-display" id="delayValue">30 FPS</span>
    </div>

    <!-- FORME -->
    <div class="control-group">
      <label>📐 Forme</label>
      <div class="button-group">
        <button id="circleBtn">Cercle</button>
        <button id="squareBtn">Carré</button>
        <button id="triangleBtn">Triangle</button>
        <button id="starBtn">Étoile</button>
        <button id="bezierBtn">Bezier</button>
      </div>
    </div>

    <!-- DIAPORAMA -->
    <div class="control-group">
      <label>▶️ Diaporama</label>
      <div class="button-group">
        <button id="startBtn">▶️ Start</button>
        <button id="stopBtn">⏹️ Stop</button>
      </div>
    </div>

    <!-- NOMBRE DE FORMES -->
    <div class="control-group">
      <label>🔢 Formes par frame</label>
      <input type="range" id="shapeCount" min="1" max="20" value="1">
      <span class="value-display" id="shapeCountValue">1</span>
    </div>

    <!-- COULEURS -->
    <div class="control-group">
      <label>🎨 Couleurs</label>
      <div class="button-group">
        <button id="colorRed" class="color-btn" style="background-color: #FF0000;" title="Rouge"></button>
        <button id="colorBlue" class="color-btn" style="background-color: #0000FF;" title="Bleu"></button>
        <button id="colorYellow" class="color-btn" style="background-color: #FFFF00; color: #000;" title="Jaune"></button>
        <button id="colorGreen" class="color-btn" style="background-color: #00FF00; color: #000;" title="Vert"></button>
        <button id="colorOrange" class="color-btn" style="background-color: #FF8800;" title="Orange"></button>
        <button id="colorPurple" class="color-btn" style="background-color: #AA00FF;" title="Violet"></button>
      </div>
    </div>

    <!-- COULEURS ALEATOIRES -->
    <div class="control-group">
      <label>
        <input type="checkbox" id="randomizeColor">
        ✨ Couleurs aléatoires
      </label>
    </div>

    <!-- CLEAR -->
    <div class="control-group">
      <button id="clearBtn" style="width: 100%;">🗑️ Effacer</button>
    </div>

    <!-- EXPORT -->
    <div class="control-group">
      <button id="saveBtn" style="width: 100%; margin-bottom: 5px;">💾 JPG</button>
      <button id="saveGifBtn" style="width: 100%;">🎬 GIF</button>
    </div>
  </div>

  <img id="image">

  <script src="sketch.js"></script>
</body>

</html>
