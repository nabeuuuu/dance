<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diaporama Boucle avec Délai Réglable</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>CHOOSE YOUR VIBE</h1>

  <div class="slideshow-container">
    <img id="image" src="" alt="Image du diaporama">
  </div>

  <div id="controls">
    <label for="delayRange">Speed</label><br>
    <input type="range" class="custom-slider" id="delayRange" min="90" max="500" step="100" value="2000">
    <span id="delayValue">2.0</span> s
  </div>

  <div class="buttons">
    <button id="startBtn">Démarrer</button>
    <button id="stopBtn">Arrêter</button>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
